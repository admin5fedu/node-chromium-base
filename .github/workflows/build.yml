name: build

on:
  push:
    branches: [main]
  schedule:
    # Ngày 1 hằng tháng 02:00 UTC — lấy bản vá bảo mật mới của Chromium/Alpine.
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/admin5fedu/node-chromium

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "ngay=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build (nạp vào docker để thử trước khi đẩy)
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: |
            ${{ env.IMAGE }}:22
            ${{ env.IMAGE }}:22-${{ steps.tag.outputs.ngay }}

      - name: Smoke test — Chromium chạy được, có font Noto
        run: |
          docker run --rm "$IMAGE:22" sh -c '
            set -e
            node --version
            chromium-browser --version
            chromium-browser --headless --no-sandbox --disable-gpu --dump-dom about:blank > /dev/null
            fc-list | grep -qi "noto" && echo "font noto: có"
          '

      - name: Push
        run: |
          docker push "$IMAGE:22"
          docker push "$IMAGE:22-${{ steps.tag.outputs.ngay }}"
